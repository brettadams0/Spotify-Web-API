name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pyflakes

      - name: Lint
        run: python -m pyflakes spotifystats/ tests/ app.py wsgi.py

      - name: Test
        run: python -m pytest

      - name: Check every template compiles
        run: |
          python - <<'PY'
          import pathlib
          from spotifystats import create_app

          env = create_app().jinja_env
          broken = []
          for path in pathlib.Path("templates").rglob("*.html"):
              name = str(path.relative_to("templates"))
              try:
                  env.get_template(name)
              except Exception as exc:
                  broken.append(f"{name}: {exc}")
          if broken:
              raise SystemExit("Templates failed to compile:\n" + "\n".join(broken))
          print("All templates compile.")
          PY

      - name: Check the production entry point boots
        env:
          SECRET_KEY: ci-secret
          SPOTIFY_CLIENT_ID: ci-client-id
          SPOTIFY_CLIENT_SECRET: ci-client-secret
        run: |
          gunicorn wsgi:app --bind 127.0.0.1:8000 --workers 1 --timeout 30 \
            --daemon --pid gunicorn.pid
          for _ in $(seq 1 15); do
            curl -sf http://127.0.0.1:8000/healthz && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/healthz > /dev/null
          curl -sf http://127.0.0.1:8000/ > /dev/null
          kill "$(cat gunicorn.pid)"

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t spotify-stats:ci .
