<li>
  <a class="tile" href="{{ artist.url or '#' }}" target="_blank" rel="noopener"
     data-id="{{ artist.id }}" data-rank="{{ artist.rank }}"
     data-search="{{ artist.name|lower }} {{ artist.genres|join(' ')|lower }}">
    <div class="tile-art tile-art-round">
      {% if artist.image %}
        <img src="{{ artist.image }}"
             {% if artist.srcset %}srcset="{{ artist.srcset }}" sizes="(min-width: 700px) 160px, 120px"{% endif %}
             alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer">
      {% else %}
        <span class="art-empty" aria-hidden="true">{% include 'partials/icons/artist.svg' %}</span>
      {% endif %}
    </div>
    {# Kept outside .tile-art: a round avatar clips its own overflow. #}
    <span class="tile-delta" data-delta hidden></span>
    <span class="tile-head">
      <span class="tile-rank">{{ artist.rank }}</span>
      <span class="tile-name">{{ artist.name }}</span>
    </span>
    <span class="tile-sub">{{ artist.genres[0] if artist.genres else artist.followers_label ~ ' followers' }}</span>
  </a>
</li>
