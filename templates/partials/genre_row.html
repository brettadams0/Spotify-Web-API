<li class="genre-row" data-search="{{ genre.name|lower }}">
  <span class="genre-fill" style="width: {{ genre.bar }}%"></span>
  <span class="genre-rank">{{ genre.rank }}</span>
  <span class="genre-body">
    <span class="genre-name">{{ genre.name }}</span>
    {% if genre.artists %}
      <span class="genre-artists">{{ genre.artists|join(' · ') }}</span>
    {% endif %}
  </span>
  <span class="genre-count">{{ genre.count }}</span>
</li>
